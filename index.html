<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a4f86">
<title>Warga RT Kita</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app; curved blue header, overlapping navy summary card, 4-col menu tiles, horizontal cards, bottom nav with raised centre button */
:root{
  --bg:#eef3fb; --surface:#ffffff; --tile:#dbe7fb; --tile-2:#c9daf8; --fg:#13203a; --muted:#5e6b85; --line:#d5dfef;
  --blue:#2f7bf0; --blue-2:#1e5fd0; --head-a:#2a4f86; --head-b:#4f8fe0;
  --navy:#16233d; --navy-fg:#ffffff; --green:#22c55e; --red:#ef4444; --amber:#f5b300;
  --shadow:0 10px 24px rgba(30,70,140,.14); --shadow-sm:0 4px 12px rgba(30,70,140,.10);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --surface:#152038; --tile:#1b2a48; --tile-2:#23365c; --fg:#e8eefb; --muted:#9aa8c4; --line:#26365a;
  --blue:#4b8ff5; --blue-2:#3a7be6; --head-a:#16294a; --head-b:#2b5ca8;
  --navy:#0a1220; --navy-fg:#ffffff; --shadow:0 10px 24px rgba(0,0,0,.4); --shadow-sm:0 4px 12px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --surface:#152038; --tile:#1b2a48; --tile-2:#23365c; --fg:#e8eefb; --muted:#9aa8c4; --line:#26365a;
  --blue:#4b8ff5; --blue-2:#3a7be6; --head-a:#16294a; --head-b:#2b5ca8;
  --navy:#0a1220; --navy-fg:#ffffff; --shadow:0 10px 24px rgba(0,0,0,.4); --shadow-sm:0 4px 12px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* header */
.hero{margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:78px;
  background:radial-gradient(120% 90% at 100% 0%,var(--head-b),var(--head-a));color:#fff;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero.small{padding-bottom:22px}
.who{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.avatar{width:50px;height:50px;border-radius:50%;background:#0f1a2e;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:24px;flex:none}
.who .txt{flex:1;min-width:0}
.who h1{margin:0;font-size:20px;font-weight:800;white-space:nowrap}
.who small{font-size:12.5px;opacity:.85}
.toggle{display:flex;background:#fff;border-radius:999px;padding:3px;border:0;flex:none}
.toggle span{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#7a869c}
.toggle[aria-pressed="true"] .on,.toggle[aria-pressed="false"] .off{background:var(--blue);color:#fff}
.toggle-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;opacity:.9}
.bell{width:42px;height:42px;border-radius:12px;background:rgba(10,20,40,.35);border:0;display:grid;place-items:center;font-size:20px;position:relative;flex:none}
.bell i{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #2d528a}
.back{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.back button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
.back h1{margin:0;font-size:20px;font-weight:800}
.back small{display:block;font-size:12.5px;opacity:.85}

/* summary card */
.sum{margin-top:-60px;position:relative;z-index:2}
.sum-card{background:var(--navy);color:var(--navy-fg);border-radius:24px;padding:18px 18px 34px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.ring{--p:66;width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--green) calc(var(--p)*1%),#c9d2e0 0)}
.ring b{width:64px;height:64px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-size:20px;font-weight:800}
.sum-card .t{min-width:0}
.sum-card .t span{font-size:14px;opacity:.9}
.sum-card .t strong{display:block;font-size:21px;font-weight:800;line-height:1.2;margin-top:2px;text-wrap:balance}
.sum-card .t strong em{font-style:normal;color:var(--green)}
.sum-card .t strong small{font-size:inherit;color:#9fb0cc}
.bar{height:7px;border-radius:9px;background:#5b6b86;margin-top:10px;overflow:hidden;max-width:150px}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.cta{position:absolute;right:0;bottom:-22px;display:flex;align-items:center;gap:12px;border:0;border-radius:16px;
  background:linear-gradient(180deg,#4d95ff,var(--blue-2));color:#fff;font-weight:700;font-size:15px;padding:6px 6px 6px 18px;box-shadow:0 8px 18px rgba(47,123,240,.4)}
.cta b{width:36px;height:36px;border-radius:11px;background:var(--navy);display:grid;place-items:center;font-size:18px}

main{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.home main{padding-top:44px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2{margin:0;font-size:18px;font-weight:800}
.link{border:0;background:none;color:var(--blue);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:0}

/* menu tiles */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 10px}
.tile{position:relative;aspect-ratio:1/1.05;border:0;border-radius:18px;background:linear-gradient(180deg,var(--tile),var(--tile-2));
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 4px;
  font-size:12px;font-weight:700;color:var(--fg);text-align:center;line-height:1.15;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile.dark{background:linear-gradient(180deg,#22345a,var(--navy));color:#fff}
.tile .ic{font-size:30px;line-height:1;filter:drop-shadow(0 4px 4px rgba(20,50,110,.28))}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.badge.new{background:var(--green);font-size:9px;height:18px;letter-spacing:.04em}
.badge.soon{background:#8a97ae;font-size:9px;height:18px;letter-spacing:.03em}

/* horizontal cards */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 10px;scrollbar-width:none;margin-left:calc(-1 * max(18px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(18px,env(safe-area-inset-right,0px)));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:none;width:190px;scroll-snap-align:start;border:0;border-radius:18px;padding:14px;text-align:left;color:#fff;
  background:radial-gradient(120% 120% at 100% 0%,#3d7be0,#16233d);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:4px}
.hcard:nth-child(2n){background:radial-gradient(120% 120% at 0% 100%,#1f5fd0,#4d95ff)}
.hcard .em{font-size:28px}
.hcard b{font-size:16px;line-height:1.2}
.hcard small{font-size:12px;opacity:.85}
.hcard .st{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
.dot.off{background:#8a97ae}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--tile);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.lapak{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:18px;padding:12px;text-align:left;width:100%;box-shadow:var(--shadow-sm)}
.ava{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:27px;background:linear-gradient(180deg,var(--tile),var(--tile-2))}
.lapak .info{min-width:0}
.lapak b{display:block;font-size:15px}
.lapak .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.buka{background:rgba(34,197,94,.15);color:#15934a}
.pill.tutup{background:var(--tile);color:var(--muted)}
.ann{background:var(--surface);border-radius:18px;padding:14px;display:flex;gap:12px;box-shadow:var(--shadow-sm)}
.ann .aic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:21px;background:linear-gradient(180deg,var(--tile),var(--tile-2))}
.ann .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.ann.pin{outline:2px solid var(--amber)}
.ann .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{font-weight:800;font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--tile);color:var(--fg);letter-spacing:.02em}
.tag.Penting{background:rgba(239,68,68,.14);color:var(--red)}
.tag.Kegiatan{background:rgba(34,197,94,.15);color:#15934a}
.ann h3{margin:0;font-size:15px}
.ann p{margin:0;font-size:13.5px;color:var(--muted)}
.form{background:var(--surface);border:2px dashed var(--blue);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form input,.form textarea,.form select,.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%}
.sos{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow-sm)}
.sos .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(239,68,68,.12)}
.sos b{display:block}
.sos .num{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);user-select:all}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--tile);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:linear-gradient(180deg,#4d95ff,var(--blue-2));color:#fff;box-shadow:0 8px 18px rgba(47,123,240,.3)}
.btn.big{width:100%;padding:14px;font-size:15px;border-radius:14px}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.note{font-size:12.5px;color:var(--muted);background:var(--tile);border-radius:12px;padding:10px 12px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:460px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(30,70,140,.12);
  display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{border:0;background:none;padding:12px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#97a3b8}
nav.tabs button .i{font-size:22px;line-height:1;filter:grayscale(1) opacity(.6)}
nav.tabs button[aria-selected="true"]{color:var(--fg)}
nav.tabs button[aria-selected="true"] .i{filter:none}
nav.tabs .center{position:relative;top:-22px;padding:0}
nav.tabs .center .i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;filter:none;
  background:radial-gradient(circle at 35% 30%,#6aa8ff,var(--blue-2));box-shadow:0 10px 22px rgba(47,123,240,.45);border:4px solid var(--surface)}
nav.tabs .center span:last-child{margin-top:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,15,30,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:460px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.sh-head{display:flex;gap:12px;align-items:center}
.sh-head .info{flex:1;min-width:0}
.sh-head h3{margin:0;font-size:18px}
.sh-head p{margin:0;font-size:13px;color:var(--muted)}
.close{border:0;background:var(--tile);border-radius:50%;width:34px;height:34px;font-size:18px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-size:14.5px}
.item .price{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:10px;border:0;background:var(--tile);font-weight:800;font-size:16px}
.qty button[data-d="1"]{background:var(--blue);color:#fff}
.qty output{min-width:18px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.preview{white-space:pre-wrap;font-size:13px;background:rgba(34,197,94,.13);border-radius:14px 14px 14px 3px;padding:10px 12px}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (max-width:360px){.tile{font-size:11px}.tile .ic{font-size:26px}.sum-card .t strong{font-size:18px}}
</style>
</head>
<body>

<div class="app" id="app"></div>

<nav class="tabs" aria-label="Menu utama"><div class="in" role="tablist">
  <button role="tab" data-tab="home"><span class="i">🏠</span>Beranda</button>
  <button role="tab" data-tab="info"><span class="i">📢</span>Info</button>
  <button role="tab" data-tab="warung" class="center" aria-label="Warung Warga"><span class="i">🛒</span><span>Warung</span></button>
  <button role="tab" data-tab="darurat"><span class="i">🚨</span>Darurat</button>
  <button role="tab" data-tab="akun"><span class="i">👤</span>Akun</button>
</div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const rupiah = n => "Rp" + n.toLocaleString("id-ID");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const lapak = [
  {id:1, nama:"Nasi Uduk Bu Siti", ava:"🍛", kat:"Makanan", alamat:"Blok A no. 3", jam:"06.00–10.00", buka:true, wa:"6281200000001", antar:true,
   menu:[["Nasi uduk komplit",12000],["Nasi uduk telor",9000],["Gorengan (3 pcs)",5000],["Teh manis",3000]]},
  {id:2, nama:"Sembako Pak Darto", ava:"🧺", kat:"Sembako", alamat:"Blok B no. 11", jam:"07.00–21.00", buka:true, wa:"6281200000002", antar:true,
   menu:[["Beras 5 kg",72000],["Minyak goreng 1 L",18000],["Telur 1 kg",29000],["Gas 3 kg (isi ulang)",23000],["Galon air isi ulang",7000]]},
  {id:3, nama:"Kue Basah Mbak Rina", ava:"🍰", kat:"Jajanan", alamat:"Blok C no. 7", jam:"Pesan H-1", buka:true, wa:"6281200000003", antar:false,
   menu:[["Klepon (isi 10)",15000],["Lapis legit (loyang kecil)",85000],["Risol mayo (isi 5)",15000]]},
  {id:4, nama:"Es Kelapa Bang Udin", ava:"🥥", kat:"Jajanan", alamat:"Pos ronda depan", jam:"11.00–17.00", buka:false, wa:"6281200000004", antar:true,
   menu:[["Es kelapa muda",8000],["Jus alpukat",12000],["Jus jeruk",10000]]},
  {id:5, nama:"Laundry Bu Yati", ava:"👕", kat:"Jasa", alamat:"Blok D no. 2", jam:"08.00–20.00", buka:true, wa:"6281200000005", antar:true,
   menu:[["Cuci setrika (per kg)",7000],["Setrika saja (per kg)",5000],["Bed cover",25000]]},
  {id:6, nama:"Servis AC Mas Joko", ava:"🔧", kat:"Jasa", alamat:"Blok A no. 9", jam:"Panggilan", buka:false, wa:"6281200000006", antar:false,
   menu:[["Cuci AC",75000],["Cek instalasi listrik",50000]]},
];

let pengumuman = [
  {id:1, pin:true, ic:"🧹", tag:"Penting", judul:"Kerja bakti bersih selokan", isi:"Minggu, 29 November jam 07.00. Kumpul di pos ronda, bawa cangkul atau sapu lidi. Habis itu sarapan bareng.", tgl:"22 Nov"},
  {id:2, ic:"💰", tag:"Info", judul:"Iuran sampah & keamanan Desember", isi:"Rp35.000 per KK. Bayar ke admin atau transfer, jangan lupa kirim bukti.", tgl:"20 Nov"},
  {id:3, ic:"👶", tag:"Kegiatan", judul:"Posyandu balita & lansia", isi:"Selasa, 1 Desember jam 08.00–11.00 di rumah Bu RT, Blok B no. 1.", tgl:"18 Nov"},
  {id:4, ic:"🔦", tag:"Info", judul:"Jadwal ronda minggu ini", isi:"Senin Blok A · Selasa Blok B · Rabu Blok C · Kamis Blok D · Jumat–Minggu gabungan.", tgl:"16 Nov"},
];
let unread = 3;

const darurat = [
  ["👤","Ketua RT (Pak Hendra)","0812-0000-0101"],
  ["🛡️","Pos Satpam / Ronda","0812-0000-0102"],
  ["🚑","Ambulans / Gawat darurat","119"],
  ["🚓","Polisi","110"],
  ["🚒","Pemadam kebakaran","113"],
  ["🏥","Puskesmas Kelurahan","021-0000-0103"],
  ["⚡","PLN (gangguan listrik)","123"],
];

let tab = "home", kat = "Semua", cari = "", admin = false;
const app = document.getElementById("app");

function header(title, sub){
  if(!title) return `
  <section class="hero gut">
    <div class="who">
      <div class="avatar">🏡</div>
      <div class="txt"><h1>Halo, Warga!</h1><small>RT 05 / RW 03</small></div>
      <div class="toggle-wrap"><button class="toggle" id="adminBtn" aria-pressed="${admin}" aria-label="Mode admin"><span class="on">ON</span><span class="off">OFF</span></button>Admin</div>
      <button class="bell" id="bell" aria-label="Notifikasi">🔔${unread?"<i></i>":""}</button>
    </div>
  </section>`;
  return `
  <section class="hero small gut"><div class="back">
    <button data-go="home" aria-label="Kembali ke beranda">‹</button>
    <div><h1>${title}</h1><small>${sub}</small></div>
  </div></section>`;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  app.className = "app " + (tab==="home" ? "home" : "");
  ({home:renderHome, warung:renderWarung, info:renderInfo, darurat:renderDarurat, akun:renderAkun})[tab]();
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  const ab = document.getElementById("adminBtn"); if(ab) ab.onclick = () => { admin = !admin; toast(admin ? "Mode admin ON: bisa bikin pengumuman & tambah lapak" : "Mode admin OFF"); render(); };
  const bell = document.getElementById("bell"); if(bell) bell.onclick = () => { unread = 0; go("info"); };
}
function go(t){ tab = t; render(); scrollTo(0,0); }

function renderHome(){
  const buka = lapak.filter(l=>l.buka).length, pct = Math.round(buka/lapak.length*100);
  const soon = n => () => toast(`${n} segera hadir di versi berikutnya`);
  const menu = [
    ["🛒","Warung Warga","warung",null,true],
    ["📢","Pengumuman","info",unread||null],
    ["🚨","Nomor Darurat","darurat"],
    ["🔧","Jasa Warga","jasa"],
    ["🔦","Jadwal Ronda",null,"SEGERA"],
    ["💰","Iuran Warga",null,"SEGERA"],
    ["📅","Kegiatan RT",null,"SEGERA"],
    ["🧩","Lainnya",null,"SEGERA"],
  ];
  app.innerHTML = header() + `
  <div class="gut sum"><div class="sum-card">
      <div class="ring" style="--p:${pct}"><b>${buka}</b></div>
      <div class="t"><span>Warung warga hari ini</span>
        <strong><em>${buka}</em> dari ${lapak.length} Lapak <small>Buka</small></strong>
        <div class="bar"><i style="width:${pct}%"></i></div></div>
    </div>
    <button class="cta" data-go="warung">Belanja Sekarang <b>→</b></button>
  </div>
  <main class="gut">
    <h2>Menu Utama</h2>
    <div class="grid">${menu.map(([ic,n,to,bd,dark],i)=>`
      <button class="tile ${dark?"dark":""}" data-menu="${i}">
        ${bd ? `<span class="badge ${bd==="SEGERA"?"soon":""}">${bd}</span>`:""}
        <span class="ic">${ic}</span>${n}</button>`).join("")}</div>

    <div class="sec-head"><h2>Lapak Warga</h2><button class="link" data-go="warung">Lihat Semua</button></div>
    <div class="hscroll">${lapak.map(l=>`
      <button class="hcard" data-lapak="${l.id}"><span class="em">${l.ava}</span><b>${esc(l.nama)}</b><small>${esc(l.alamat)}</small>
        <span class="st"><span><span class="dot ${l.buka?"":"off"}"></span>${l.buka?"Buka":"Tutup"}</span><span>${esc(l.jam)}</span></span></button>`).join("")}</div>

    <div class="sec-head"><h2>Pengumuman Terbaru</h2><button class="link" data-go="info">Lihat Semua</button></div>
    <div class="list">${annCard(pengumuman.find(a=>a.pin)||pengumuman[0])}</div>
  </main>`;
  app.querySelectorAll("[data-menu]").forEach(b => b.onclick = () => {
    const m = menu[+b.dataset.menu];
    if(m[2]==="jasa"){ kat="Jasa"; go("warung"); }
    else if(m[2]){ if(m[2]==="info") unread=0; if(m[2]==="warung") kat="Semua"; go(m[2]); }
    else soon(m[1])();
  });
  app.querySelectorAll("[data-lapak]").forEach(b => b.onclick = () => openLapak(+b.dataset.lapak));
}

function annCard(a){ return `
  <article class="ann ${a.pin?"pin":""}"><div class="aic">${a.ic||"📌"}</div><div class="body">
    <div class="row"><span class="tag ${a.tag}">${a.tag.toUpperCase()}</span>${a.pin?"<span>📌 Disematkan</span>":""}<span>${a.tgl}</span></div>
    <h3>${esc(a.judul)}</h3><p>${esc(a.isi)}</p></div></article>`; }

function renderWarung(){
  const kats = ["Semua","Makanan","Jajanan","Sembako","Jasa"];
  const q = cari.toLowerCase();
  const rows = lapak.filter(l => (kat==="Semua"||l.kat===kat) && (!q || l.nama.toLowerCase().includes(q) || l.menu.some(m=>m[0].toLowerCase().includes(q))));
  app.innerHTML = header("Warung Warga","Belanja dari tetangga, pesan lewat WhatsApp") + `
  <main class="gut">
    <input class="search" id="cari" type="search" placeholder="🔍  Cari nasi uduk, gas, laundry…" value="${esc(cari)}" aria-label="Cari barang atau lapak">
    <div class="chips">${kats.map(k=>`<button class="chip" data-kat="${k}" aria-pressed="${k===kat}">${k}</button>`).join("")}</div>
    <div class="list">${rows.length ? rows.map(l=>`
      <button class="lapak" data-lapak="${l.id}">
        <div class="ava">${l.ava}</div>
        <div class="info"><b>${esc(l.nama)}</b><div class="meta">${esc(l.alamat)} · ${esc(l.jam)}${l.antar?" · bisa antar":""}</div></div>
        <span class="pill ${l.buka?"buka":"tutup"}">${l.buka?"Buka":"Tutup"}</span>
      </button>`).join("") : `<div class="note">Belum ada lapak yang cocok. Coba kata lain.</div>`}</div>
    ${admin ? `<button class="btn primary big" id="addLapak">+ Tambah lapak warga</button>` : `<div class="note">Mau buka lapak juga? Hubungi admin buat didaftarin, gratis.</div>`}
    <div class="note">Prototipe: semua nama, nomor, dan harga di sini cuma contoh.</div>
  </main>`;
  document.getElementById("cari").addEventListener("input", e => { cari = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("cari"); n.focus(); n.setSelectionRange(pos,pos); });
  app.querySelectorAll("[data-kat]").forEach(b => b.onclick = () => { kat = b.dataset.kat; render(); });
  app.querySelectorAll("[data-lapak]").forEach(b => b.onclick = () => openLapak(+b.dataset.lapak));
  const add = document.getElementById("addLapak"); if(add) add.onclick = () => toast("Di versi jadi, admin isi form lapak di sini");
}

function renderInfo(){
  const sorted = [...pengumuman].sort((a,b)=> (b.pin?1:0)-(a.pin?1:0) || b.id-a.id);
  app.innerHTML = header("Pengumuman RT","Info resmi dari pengurus") + `
  <main class="gut">
    ${admin ? `
    <form class="form" id="annForm">
      <b>Buat pengumuman baru</b>
      <label for="aJudul">Judul<input id="aJudul" required placeholder="Contoh: Pemadaman listrik Kamis"></label>
      <label for="aIsi">Isi<textarea id="aIsi" rows="3" required placeholder="Tulis detailnya…"></textarea></label>
      <label for="aTag">Jenis<select id="aTag"><option>Info</option><option>Penting</option><option>Kegiatan</option></select></label>
      <button class="btn primary big" type="submit">Kirim pengumuman</button>
    </form>` : `<div class="note">Nyalain <b>Admin ON</b> di beranda buat nyoba bikin pengumuman.</div>`}
    <div class="list">${sorted.map(annCard).join("")}</div>
  </main>`;
  const f = document.getElementById("annForm");
  if(f) f.addEventListener("submit", e => {
    e.preventDefault();
    pengumuman.push({id:Date.now(), ic:"📣", tag:document.getElementById("aTag").value, judul:document.getElementById("aJudul").value.trim(), isi:document.getElementById("aIsi").value.trim(), tgl:"Baru saja"});
    render(); toast("Pengumuman terkirim (di prototipe cuma tersimpan sementara)");
  });
}

function renderDarurat(){
  app.innerHTML = header("Nomor Darurat","Simpan biar nggak panik pas ada apa-apa") + `
  <main class="gut"><div class="list">${darurat.map(([ic,n,num])=>`
      <div class="sos"><div class="ic">${ic}</div><div><b>${n}</b><span class="num">${num}</span></div>
      <button class="btn" data-copy="${num}">Salin</button></div>`).join("")}</div>
    <div class="note">Di versi jadi, nomor bisa langsung ditekan buat nelpon dari HP.</div></main>`;
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast("Nomor disalin"); }
    catch { const s = b.previousElementSibling.querySelector(".num"); const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Nomor ditandai, tinggal salin"); }
  });
}

function renderAkun(){
  app.innerHTML = header("Akun Saya","Data warga") + `
  <main class="gut"><div class="list">
    <div class="lapak" style="cursor:default"><div class="ava">🏡</div><div class="info"><b>Warga RT 05</b><div class="meta">Blok C no. 5 · contoh</div></div><span class="pill buka">Warga</span></div>
    <div class="note">Di versi jadi, warga bisa simpan alamat sekali aja biar nggak ngetik ulang tiap pesan, dan pedagang bisa atur lapaknya sendiri.</div>
  </div></main>`;
}

/* ---------- Order sheet ---------- */
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
let cart = {}, cur = null, alamat = "", catatan = "";
function openLapak(id){ cur = lapak.find(l=>l.id===id); cart = {}; drawSheet(); sheet.hidden = false; scrim.hidden = false; sheet.querySelector(".close").focus(); }
function closeSheet(){ sheet.hidden = true; scrim.hidden = true; }
scrim.onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape" && !sheet.hidden) closeSheet(); });
function pesan(){
  const items = cur.menu.map((m,i)=>[m, cart[i]||0]).filter(x=>x[1]>0);
  const total = items.reduce((s,[m,q])=>s+m[1]*q,0);
  let t = `Halo ${cur.nama}, saya warga RT 05 mau pesan:\n`;
  items.forEach(([m,q])=> t += `• ${q}x ${m[0]} (${rupiah(m[1]*q)})\n`);
  t += `Total: ${rupiah(total)}\n`;
  if(alamat) t += `${cur.antar?"Antar ke":"Saya di"}: ${alamat}\n`;
  if(catatan) t += `Catatan: ${catatan}\n`;
  return {items,total,text:t + `Terima kasih 🙏`};
}
const EMPTY = "Pilih barang dulu ya, nanti pesannya muncul di sini.";
function drawSheet(){
  const p = pesan();
  sheet.innerHTML = `
    <div class="grab"></div>
    <div class="sh-head"><div class="ava">${cur.ava}</div>
      <div class="info"><h3>${esc(cur.nama)}</h3><p>${esc(cur.alamat)} · ${esc(cur.jam)}</p></div>
      <button class="close" aria-label="Tutup">×</button></div>
    ${cur.buka ? "" : `<div class="note">Lapak lagi tutup. Pesanan tetap bisa dikirim, nanti dibalas pas buka.</div>`}
    <div>${cur.menu.map((m,i)=>`
      <div class="item"><div><b>${esc(m[0])}</b><span class="price">${rupiah(m[1])}</span></div>
        <div class="qty"><button data-m="${i}" data-d="-1" aria-label="Kurangi ${esc(m[0])}">−</button><output>${cart[i]||0}</output><button data-m="${i}" data-d="1" aria-label="Tambah ${esc(m[0])}">+</button></div></div>`).join("")}</div>
    <label class="lbl" for="alamat">${cur.antar ? "Antar ke mana?" : "Rumah kamu di mana?"}</label>
    <input id="alamat" placeholder="Contoh: Blok C no. 5" value="${esc(alamat)}">
    <label class="lbl" for="catatan">Catatan (opsional)</label>
    <input id="catatan" placeholder="Contoh: sambalnya dipisah" value="${esc(catatan)}">
    <span class="lbl">Pesan yang bakal dikirim ke WhatsApp penjual</span>
    <div class="preview" id="preview">${p.items.length ? esc(p.text) : EMPTY}</div>
    <a class="btn primary big" id="waBtn" target="_blank" rel="noopener" aria-disabled="${!p.items.length}"
       href="https://wa.me/${cur.wa}?text=${encodeURIComponent(p.text)}">💬 Pesan via WhatsApp${p.items.length?" · "+rupiah(p.total):""}</a>
    <div class="note">Di prototipe, nomor WA penjual masih contoh, jadi tombol ini belum nyampe ke orang beneran.</div>`;
  sheet.querySelector(".close").onclick = closeSheet;
  sheet.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    const i = +b.dataset.m; cart[i] = Math.max(0,(cart[i]||0) + +b.dataset.d); drawSheet();
    const again = sheet.querySelector(`[data-m="${i}"][data-d="${b.dataset.d}"]`); if(again) again.focus();
  });
  const upd = () => { const q = pesan(); document.getElementById("preview").textContent = q.items.length ? q.text : EMPTY; document.getElementById("waBtn").href = `https://wa.me/${cur.wa}?text=${encodeURIComponent(q.text)}`; };
  document.getElementById("alamat").oninput = e => { alamat = e.target.value; upd(); };
  document.getElementById("catatan").oninput = e => { catatan = e.target.value; upd(); };
}

let tt; function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden=true, 2400); }
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { if(b.dataset.tab==="info") unread=0; if(b.dataset.tab==="warung") kat="Semua"; go(b.dataset.tab); });
render();
</script>
</body>
</html>
